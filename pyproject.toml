[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebrain"
version = "0.1.0"
description = "RAG-powered codebase chatbot"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "CodeBrain"},
]
keywords = ["rag", "chatbot", "codebase", "llm", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "tiktoken>=0.5.2",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=2.3.0",
]
openai = [
    "openai>=1.10.0",
]
anthropic = [
    "anthropic>=0.18.0",
]
all = [
    "sentence-transformers>=2.3.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "chromadb>=0.4.22",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codebrain = "codebrain.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/codebrain"
Repository = "https://github.com/yourusername/codebrain"

[tool.setuptools.packages.find]
where = ["src"]
